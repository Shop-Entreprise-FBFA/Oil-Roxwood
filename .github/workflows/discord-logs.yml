name: Sync logs Discord

# ═══════════════════════════════════════════════════════════════════════
#  IL NE RESTE QU'UNE TÂCHE ICI, ET C'EST VOULU.
#
#  GitHub met les tâches planifiées des dépôts publics en file d'attente :
#  ce workflow demande « toutes les 15 minutes » et passe en réalité toutes
#  les 2 à 4 heures. Ce retard était sans conséquence pour un écran de
#  consultation, mais fatal pour tout ce qui promet une heure précise.
#
#  Sont donc passés au bot Discord (cogs/site_bridge.py, cogs/releves_site.py),
#  qui est connecté en permanence et vérifie chaque minute :
#
#    · les rappels de contrat        → C-64
#    · les chiffres du site public   → C-88   (publish_stats.py supprimé)
#    · les achats de fer             → C-92   (fetch_fer_logs.py supprimé)
#    · la présence Discord           → C-92   (fetch_presence.py supprimé)
#    · les rappels d'agenda          → C-92   (agenda_reminders.py supprimé)
#
#  Ont été supprimés sans remplacement :
#
#    · send_notifs.py    — sa file n'est plus alimentée depuis C-75, quand les
#                          demandes d'accès ont disparu au profit des rôles Discord
#    · import_tables.py  — outil de migration Supabase, son travail est fait
#    · rappels_contrats.py — en veille depuis C-64, le bot fait mieux
#
#  Les logs en direct restent ici : deux cents lignes d'analyse de texte réglées
#  sur des messages qu'on ne peut pas rejouer hors production. Les déplacer
#  ferait courir le risque de casser la rubrique pour gagner de la fraîcheur sur
#  un écran qu'on consulte — mauvais échange.
# ═══════════════════════════════════════════════════════════════════════

on:
  # Plus de planification : les logs sont relus par le bot (cogs/logs_direct.py).
  # Lancement manuel seulement, en secours.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Récupérer les messages des salons
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: python scripts/fetch_discord_logs.py || true

      - name: Commit si changement
        run: |
          git config user.name "oilroxwood-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/ ':!data/etat.json'
          git diff --cached --quiet && exit 0
          git commit -m "🤖 MAJ automatique (logs Discord)"
          git pull --rebase origin main || true
          git push origin HEAD:main
