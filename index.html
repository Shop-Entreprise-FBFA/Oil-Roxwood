<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oil Roxwood — Accès réservé</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0D0A08">
<link rel="icon" type="image/png" href="assets/favicon.png?v=2">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=2">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#0D0A08;--line:#2E241E;--ink:#F3EADF;--muted:#A2948A;--gold:#E8A020;--gold2:#F7C463}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,Arial,sans-serif;overflow:hidden;position:relative;background:#0a0807}
.cond{font-family:"Bahnschrift Condensed","Arial Narrow",Impact,sans-serif;text-transform:uppercase;letter-spacing:.06em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--gold);color:#1a1005;text-decoration:none;font-weight:800;letter-spacing:.07em;text-transform:uppercase;font-size:.92rem;padding:14px 28px;border-radius:10px;transition:transform .15s,background .15s,box-shadow .15s}
.btn:hover{background:var(--gold2);transform:translateY(-2px);box-shadow:0 10px 30px rgba(232,160,32,.35)}
.btn:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}
.bg{position:absolute;inset:0;background:
 radial-gradient(ellipse 60% 55% at 72% 45%,rgba(232,160,32,.22),transparent 65%),
 radial-gradient(ellipse 50% 40% at 10% 100%,rgba(240,106,32,.16),transparent 70%),
 linear-gradient(180deg,#0a0807,#140e0a)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(247,196,99,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(247,196,99,.05) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at 70% 45%,#000 0%,transparent 70%);mask-image:radial-gradient(ellipse at 70% 45%,#000 0%,transparent 70%)}
.stripe{position:absolute;left:0;right:0;top:0;height:9px;background:repeating-linear-gradient(-45deg,#E8A020 0 14px,#16110e 14px 28px)}
.stripe.b{top:auto;bottom:0;opacity:.7}
.wrap{position:relative;z-index:2;height:100%;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;max-width:1180px;margin:0 auto;padding:0 40px;gap:40px}
.tag{display:inline-flex;gap:8px;align-items:center;padding:6px 14px;border:1px solid var(--line);border-radius:99px;color:var(--muted);font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;background:rgba(255,255,255,.02)}
h1{font-size:clamp(3.2rem,8vw,6.2rem);line-height:.95;margin:22px 0 18px}
h1 b{display:block;color:var(--gold);text-shadow:0 0 50px rgba(232,160,32,.35)}
p{color:#b9ac9f;font-size:1.05rem;max-width:460px;margin-bottom:30px}
small{display:block;margin-top:18px;color:#7b6f65;font-size:.8rem}
.vis{display:grid;place-items:center;position:relative}
.vis:before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;border:1px solid rgba(247,196,99,.18);box-shadow:0 0 0 38px rgba(247,196,99,.04),0 0 0 80px rgba(247,196,99,.025)}
.vis img{position:relative;width:min(340px,70%);filter:drop-shadow(0 20px 50px rgba(232,160,32,.35))}
@media(max-width:820px){.wrap{grid-template-columns:1fr;padding:0 24px;text-align:center;align-content:center;gap:10px}.vis{order:-1}.vis img{width:150px}.vis:before{display:none}p{margin-inline:auto}}
</style>
</head>
<body>
<div class="bg"></div><div class="grid"></div><div class="stripe"></div><div class="stripe b"></div>
<div class="wrap">
  <main class="txt">
    <span class="tag">🔒 Accès réservé · Personnel</span>
    <h1 class="cond">Oil<b>Roxwood</b></h1>
    <p>Le poste de contrôle de l’entreprise : production, commerce, ressources humaines. Connecte-toi avec ton compte Discord pour entrer.</p>
    <a class="btn" href="admin.html">Connexion personnel →</a>
    <small>Pas d’accès ? Rapproche-toi de la direction.</small>
  </main>
  <div class="vis"><img src="assets/logo.png?v=2" alt="Oil Roxwood"></div>
</div>
</body>
</html>
